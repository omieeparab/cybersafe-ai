<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password - CyberSafe AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url("{{ url_for('static', filename='cyber_bg.jpg') }}") no-repeat center center/cover;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(5px);
    z-index: 0;
  }

  .forgot-card {
    position: relative;
    z-index: 2;
    width: 400px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    padding: 45px 40px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    animation: fadeIn 1.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .heading {
    font-weight: 700;
    font-size: 24px;
    color: #1a237e;
    margin-bottom: 10px;
  }

  .subtext {
    font-size: 14px;
    color: #455a64;
    margin-bottom: 25px;
    text-align: justify;
  }

  .input {
    width: 100%;
    padding: 12px 15px;
    border-radius: 12px;
    border: 1px solid #cfd8dc;
    margin-top: 12px;
    font-size: 15px;
    color: #37474f;
    background: rgba(255,255,255,0.9);
    transition: all 0.3s ease;
    box-sizing: border-box;
  }

  .input:focus {
    outline: none;
    border-color: #90caf9;
    background: #ffffff;
    box-shadow: 0 0 8px rgba(144,202,249,0.5);
  }

  .input.error {
    border-color: #e53935 !important;
    box-shadow: 0 0 8px rgba(229, 57, 53, 0.5);
  }

  .reset-button {
    width: 100%;
    padding: 12px;
    margin-top: 25px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #1565c0, #64b5f6);
    color: white;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(21, 101, 192, 0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .reset-button:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 25px rgba(21,101,192,0.6);
  }

  .login-link {
    margin-top: 25px;
    font-size: 14px;
    color: #455a64;
  }

  .login-link a {
    color: #1565c0;
    text-decoration: none;
    font-weight: 600;
  }

  .login-link a:hover {
    text-decoration: underline;
  }

  .error-message {
    color: #e53935;
    margin-top: 10px;
    font-weight: 600;
    text-align: center;
    animation: shake 0.3s ease;
    display: none;
  }

  .success-message {
    color: green;
    margin-top: 10px;
    font-weight: 600;
    text-align: center;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
</style>
</head>
<body>
  <div class="forgot-card">
    <div class="heading">Forgot Password</div>
    <div class="subtext">Enter your username and new password to reset your account.</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p class="{{ category }}-message">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" id="forgotForm" novalidate>
      <input class="input" type="text" name="username" placeholder="Username" required>
      <input class="input" type="password" name="new_password" id="new_password" placeholder="New Password" required>
      <input class="input" type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required>

      <p class="error-message" id="clientError"></p>
      <button class="reset-button" type="submit">Reset Password</button>
    </form>

    <div class="login-link">
      Back to <a href="{{ url_for('login') }}">Login</a>
    </div>
  </div>

<script>
  const form = document.getElementById("forgotForm");
  const usernameField = form.querySelector("input[name='username']");
  const newPasswordField = document.getElementById("new_password");
  const confirmField = document.getElementById("confirm_password");
  const errorDiv = document.getElementById("clientError");

  // Form validation
  form.addEventListener("submit", (event) => {
    let valid = true;
    let errorMsg = "";

    [usernameField, newPasswordField, confirmField].forEach(f => f.classList.remove("error"));
    errorDiv.style.display = "none";

    const usernamePattern = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_\-+=<>?]).{3,}$/;
    const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_\-+=<>?]).{10,}$/;

    const username = usernameField.value.trim();
    const password = newPasswordField.value;
    const confirm = confirmField.value;

    if (!usernamePattern.test(username)) {
      valid = false;
      usernameField.classList.add("error");
      errorMsg = "Username must include letters, numbers, and at least one special character.";
    } else if (!passwordPattern.test(password)) {
      valid = false;
      newPasswordField.classList.add("error");
      errorMsg = "Password must be at least 10 characters and include uppercase, lowercase, number & special character.";
    } else if (password !== confirm) {
      valid = false;
      confirmField.classList.add("error");
      errorMsg = "Passwords do not match.";
    }

    if (!valid) {
      event.preventDefault();
      errorDiv.textContent = errorMsg;
      errorDiv.style.display = "block";
    }
  });
</script>
</body>
</html>
